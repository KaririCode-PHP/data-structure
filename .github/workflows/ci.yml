name: CI

# Quality gate through KaririCode Devkit (kcode). The toolchain is not in
# require-dev: kcode installs it into .kcode/ and runs cs-fixer, PHPStan,
# Psalm and PHPUnit. Actions are pinned by commit SHA, with the release they
# resolve to in a comment; kcode is pinned by version and SHA-256.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KCODE_VERSION: 1.2.2
  KCODE_SHA256: 11b889f49c9d11445dabac3ac8c725819cd5e33d30eee609db49691746423487

jobs:
  quality:
    name: Quality (kcode)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install runtime dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Install kcode ${{ env.KCODE_VERSION }}, checksum verified
        run: |
          curl -fsSLo kcode.phar "https://github.com/KaririCode-PHP/devkit/releases/download/v${KCODE_VERSION}/kcode.phar"
          echo "${KCODE_SHA256}  kcode.phar" | sha256sum -c -
          sudo install -m 0755 kcode.phar /usr/local/bin/kcode

      - name: Generate .kcode/ and install the toolchain
        run: kcode init

      - name: cs-fixer, PHPStan, Psalm, PHPUnit
        run: kcode quality

      - name: Security audit
        if: always()
        # Composer exits 1 when there is nothing to audit.
        run: |
          if jq -e '(.packages + ."packages-dev") | length > 0' composer.lock > /dev/null; then
            composer audit --format=plain
          else
            echo "composer.lock has no packages, so there is nothing to audit."
          fi
